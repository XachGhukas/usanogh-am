<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ուսանող AM | Usanog.AM</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; }
            #studentDetailModal { position: absolute !important; inset: 0 !important; background: white !important; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased bg-slate-50 text-slate-800">

    <!-- NAVIGATION HEADER -->
    <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-200 shadow-sm no-print">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <div class="flex items-center gap-3 cursor-pointer" onclick="switchTab('students')">
                    <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-600 text-white flex items-center justify-center font-black text-2xl shadow-lg">
                        ՈՒ
                    </div>
                    <div>
                        <div class="flex items-center gap-1.5">
                            <span class="text-2xl font-extrabold tracking-tight text-blue-600">Ուսանող․եմ</span>
                            <span class="bg-emerald-100 text-emerald-700 text-[10px] font-bold px-2 py-0.5 rounded-full">PRO v5.0</span>
                        </div>
                        <p class="text-xs text-slate-500 font-medium">Համալսարանական էլեկտրոնային համակարգ</p>
                    </div>
                </div>

                <div class="hidden md:flex flex-1 max-w-md mx-8 relative">
                    <input type="text" id="globalSearch" oninput="handleSearch(this.value)" 
                        placeholder="Որոնել ուսանող, առարկա, ֆակուլտետ..." 
                        class="w-full pl-10 pr-4 py-2.5 text-sm bg-slate-100 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-slate-400"></i>
                </div>

                <div class="flex items-center gap-2">
                    <button onclick="exportData()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2.5 rounded-xl font-semibold text-xs flex items-center gap-1.5">
                        <i class="fa-solid fa-download"></i> Պահպանել
                    </button>
                    <button onclick="document.getElementById('importFile').click()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2.5 rounded-xl font-semibold text-xs flex items-center gap-1.5">
                        <i class="fa-solid fa-upload"></i> Բեռնել
                    </button>
                    <input type="file" id="importFile" accept=".json" onchange="importData(event)" class="hidden">

                    <button onclick="openAddStudentModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2.5 rounded-xl font-semibold text-sm shadow-md transition-all">
                        <i class="fa-solid fa-user-plus mr-1"></i> Ավելացնել ուսանող
                    </button>
                </div>
            </div>

            <!-- TABS -->
            <div class="flex space-x-1 border-t border-slate-100 py-2 overflow-x-auto">
                <button id="tab-students" onclick="switchTab('students')" class="nav-tab text-blue-600 bg-blue-50 px-4 py-2 rounded-lg text-sm font-semibold flex items-center gap-2">
                    <i class="fa-solid fa-users"></i> Ուսանողներ
                </button>
                <button id="tab-gradebook" onclick="switchTab('gradebook')" class="nav-tab text-slate-600 hover:bg-slate-100 px-4 py-2 rounded-lg text-sm font-semibold flex items-center gap-2">
                    <i class="fa-solid fa-book-bookmark text-indigo-600"></i> Էլեկտրոնային օրագիր
                </button>
                <button id="tab-archive" onclick="switchTab('archive')" class="nav-tab text-slate-600 hover:bg-slate-100 px-4 py-2 rounded-lg text-sm font-semibold flex items-center gap-2">
                    <i class="fa-solid fa-box-archive"></i> Արխիվացված թեմաներ
                </button>
                <button id="tab-history" onclick="switchTab('history')" class="nav-tab text-slate-600 hover:bg-slate-100 px-4 py-2 rounded-lg text-sm font-semibold flex items-center gap-2">
                    <i class="fa-solid fa-clock-rotate-left"></i> Պատմություն
                </button>
            </div>
        </div>
    </header>

    <!-- STATS BANNER -->
    <div class="bg-gradient-to-r from-blue-900 to-indigo-900 text-white py-4 px-4 no-print">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <h1 class="text-xl font-bold">Ուսանողների գրանցամատյան</h1>
            <div class="flex items-center gap-4 bg-white/10 px-4 py-2 rounded-xl">
                <div>Ուսանողներ՝ <span id="statTotalStudents" class="font-bold text-emerald-400">0</span></div>
            </div>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">

        <!-- TAB 1: STUDENTS -->
        <section id="section-students" class="space-y-6">
            <div id="studentsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
            <div id="emptyStudentsState" class="hidden text-center py-16 bg-white rounded-3xl border border-dashed border-slate-300">
                <h3 class="text-lg font-bold text-slate-700">Ուսանողներ գրանցված չեն</h3>
                <button onclick="openAddStudentModal()" class="mt-4 bg-blue-600 text-white px-5 py-2.5 rounded-xl font-semibold text-sm">Ավելացնել ուսանող</button>
            </div>
        </section>

        <!-- TAB 2: GRADEBOOK -->
        <section id="section-gradebook" class="hidden space-y-6">
            <div class="flex items-center justify-between">
                <select id="gradebookStudentSelect" onchange="loadStudentGradebook(this.value)" class="px-4 py-2 bg-white border border-slate-300 rounded-xl text-sm font-semibold shadow-sm"></select>
                <button onclick="openAddSubjectModal()" class="bg-blue-600 text-white px-4 py-2 rounded-xl text-xs font-bold shadow">Ավելացնել առարկա</button>
            </div>
            <div id="gradebookContainer" class="space-y-6"></div>
        </section>

        <!-- TAB 3: ARCHIVE -->
        <section id="section-archive" class="hidden space-y-6">
            <div id="archivedGrid" class="space-y-4"></div>
            <div id="emptyArchiveState" class="hidden text-center py-12 bg-white rounded-2xl border">Արխիվը դատարկ է</div>
        </section>

        <!-- TAB 4: HISTORY -->
        <section id="section-history" class="hidden space-y-4">
            <div id="historyTimeline" class="bg-white p-6 rounded-2xl border space-y-3"></div>
        </section>

    </main>

    <!-- MODAL 1: ADD / EDIT STUDENT -->
    <div id="studentModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden no-print">
        <div class="bg-white rounded-3xl max-w-xl w-full p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between pb-4 border-b mb-4">
                <h3 class="text-lg font-bold text-slate-800" id="studentModalTitle">Ավելացնել ուսանող</h3>
                <button onclick="closeStudentModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form id="studentForm" onsubmit="handleSaveStudent(event)" class="space-y-4">
                <input type="hidden" id="editStudentId" value="">
                <div>
                    <label class="block text-xs font-semibold mb-1">Անուն *</label>
                    <input type="text" id="firstName" required class="w-full px-3.5 py-2 text-sm border rounded-xl bg-white">
                </div>
                <div>
                    <label class="block text-xs font-semibold mb-1">Ազգանուն *</label>
                    <input type="text" id="lastName" required class="w-full px-3.5 py-2 text-sm border rounded-xl bg-white">
                </div>
                <div>
                    <label class="block text-xs font-semibold mb-1">Հայրանուն *</label>
                    <input type="text" id="middleName" required class="w-full px-3.5 py-2 text-sm border rounded-xl bg-white">
                </div>
                <div>
                    <label class="block text-xs font-semibold mb-1">Ֆակուլտետ *</label>
                    <input type="text" id="faculty" required class="w-full px-3.5 py-2 text-sm border rounded-xl bg-white">
                </div>
                <div>
                    <label class="block text-xs font-semibold mb-1">Կուրս *</label>
                    <select id="course" class="w-full px-3.5 py-2 text-sm border rounded-xl bg-white">
                        <option value="1-ին">1-ին կուրս</option>
                        <option value="2-րդ">2-րդ կուրս</option>
                        <option value="3-րդ">3-րդ կուրս</option>
                        <option value="4-րդ">4-րդ կուրս</option>
                    </select>
                </div>
                <div class="flex justify-end gap-2 pt-4">
                    <button type="button" onclick="closeStudentModal()" class="px-4 py-2 border rounded-xl text-xs">Չեղարկել</button>
                    <button type="submit" class="bg-blue-600 text-white px-5 py-2 rounded-xl text-xs font-bold">Պահպանել</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL 2: STUDENT DETAILS -->
    <div id="studentDetailModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl max-w-3xl w-full p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between border-b pb-4 mb-4">
                <h3 class="font-bold text-lg">Ուսանողի անձնական էջ</h3>
                <div class="flex items-center gap-2">
                    <button onclick="window.print()" class="bg-slate-100 px-3 py-1.5 rounded-xl text-xs font-semibold"><i class="fa-solid fa-print"></i> Տպել</button>
                    <button onclick="closeStudentDetailModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
                </div>
            </div>
            <div id="studentProfileHeader" class="bg-blue-50 p-4 rounded-2xl mb-4"></div>
            
            <form onsubmit="handleSaveTopic(event)" class="bg-slate-50 p-4 rounded-2xl mb-4 space-y-3">
                <h4 class="font-bold text-sm">Ավելացնել թեմա կամ առարկա</h4>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <input type="text" id="topicSubject" required placeholder="Առարկա" class="px-3 py-2 text-sm border rounded-xl bg-white">
                    <input type="text" id="topicTitle" required placeholder="Թեմա" class="px-3 py-2 text-sm border rounded-xl bg-white">
                </div>
                <div class="flex justify-end">
                    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-xl text-xs font-bold">Ավելացնել</button>
                </div>
            </form>

            <div id="studentTopicsList" class="space-y-2"></div>
        </div>
    </div>

    <!-- SCRIPT LOGIC -->
    <script>
        let appData = { students: [], archiveItems: [], history: [] };
        let currentSelectedStudentId = null;

        document.addEventListener('DOMContentLoaded', () => {
            loadFromLocalStorage();
            renderStudents();
            updateGlobalStats();
            switchTab('students');
        });

        function saveToLocalStorage() {
            localStorage.setItem('usanog_am_data_v50', JSON.stringify(appData));
        }

        function loadFromLocalStorage() {
            const saved = localStorage.getItem('usanog_am_data_v50');
            if (saved) {
                try { appData = JSON.parse(saved); } catch(e) { seedDemo(); }
            } else {
                seedDemo();
            }
        }

        function seedDemo() {
            appData.students = [{
                id: 'std_1',
                firstName: 'Խաչիկ',
                lastName: 'Ղուկասյան',
                middleName: 'Թաթուլի',
                faculty: 'Կուլտուրայի ֆակուլտետ',
                course: '3-րդ',
                topics: [{ id: 'top_1', subject: 'Լուսանկարչություն', title: 'Կոմպոզիցիա', status: 'active' }],
                subjectsGradebook: [{ id: 'sub_1', name: 'Ֆոտոկոմպոզիցիա', status: 'active', grades: [] }]
            }];
            saveToLocalStorage();
        }

        function switchTab(tabName) {
            document.querySelectorAll('main > section').forEach(sec => sec.classList.add('hidden'));
            document.querySelectorAll('.nav-tab').forEach(tab => {
                tab.classList.remove('text-blue-600', 'bg-blue-50');
                tab.classList.add('text-slate-600', 'hover:bg-slate-100');
            });
            const targetSec = document.getElementById('section-' + tabName);
            const targetTab = document.getElementById('tab-' + tabName);
            if (targetSec) targetSec.classList.remove('hidden');
            if (targetTab) {
                targetTab.classList.remove('text-slate-600', 'hover:bg-slate-100');
                targetTab.classList.add('text-blue-600', 'bg-blue-50');
            }
            if (tabName === 'gradebook') {
                populateStudentSelects();
                if (appData.students.length > 0) loadStudentGradebook(appData.students[0].id);
            } else if (tabName === 'archive') {
                renderArchive();
            } else if (tabName === 'history') {
                renderHistory();
            }
        }

        function openAddStudentModal() {
            document.getElementById('editStudentId').value = '';
            document.getElementById('studentModalTitle').textContent = 'Ավելացնել ուսանող';
            document.getElementById('studentForm').reset();
            document.getElementById('studentModal').classList.remove('hidden');
        }

        function openEditStudentModal(id) {
            const st = appData.students.find(s => s.id === id);
            if (!st) return;
            document.getElementById('editStudentId').value = st.id;
            document.getElementById('studentModalTitle').textContent = 'Խմբագրել ուսանողին';
            document.getElementById('firstName').value = st.firstName;
            document.getElementById('lastName').value = st.lastName;
            document.getElementById('middleName').value = st.middleName;
            document.getElementById('faculty').value = st.faculty;
            document.getElementById('course').value = st.course;
            document.getElementById('studentModal').classList.remove('hidden');
        }

        function closeStudentModal() {
            document.getElementById('studentModal').classList.add('hidden');
        }

        function handleSaveStudent(e) {
            e.preventDefault();
            const id = document.getElementById('editStudentId').value;
            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const middleName = document.getElementById('middleName').value.trim();
            const faculty = document.getElementById('faculty').value.trim();
            const course = document.getElementById('course').value;

            if (id) {
                const st = appData.students.find(s => s.id === id);
                if (st) Object.assign(st, { firstName, lastName, middleName, faculty, course });
            } else {
                appData.students.push({
                    id: 'std_' + Date.now(),
                    firstName, lastName, middleName, faculty, course,
                    topics: [], subjectsGradebook: []
                });
            }
            saveToLocalStorage();
            closeStudentModal();
            renderStudents();
            updateGlobalStats();
        }

        function renderStudents(list = appData.students) {
            const grid = document.getElementById('studentsGrid');
            const empty = document.getElementById('emptyStudentsState');
            grid.innerHTML = '';
            if (list.length === 0) {
                empty.classList.remove('hidden');
                return;
            }
            empty.classList.add('hidden');

            list.forEach(st => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-2xl border p-5 shadow-sm hover:shadow-md transition flex flex-col justify-between';
                card.innerHTML = `
                    <div>
                        <h3 class="font-bold text-base">${st.lastName} ${st.firstName}</h3>
                        <p class="text-xs text-slate-500 mb-3">${st.faculty} (${st.course})</p>
                    </div>
                    <div class="flex gap-2 pt-3 border-t">
                        <button onclick="openStudentDetail('${st.id}')" class="flex-1 bg-blue-600 text-white py-1.5 rounded-xl text-xs font-bold">Բացել էջը</button>
                        <button onclick="openEditStudentModal('${st.id}')" class="bg-slate-100 px-3 py-1.5 rounded-xl text-xs"><i class="fa-solid fa-pen"></i></button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function openStudentDetail(id) {
            currentSelectedStudentId = id;
            const st = appData.students.find(s => s.id === id);
            if (!st) return;
            document.getElementById('studentProfileHeader').innerHTML = `<h3 class="font-bold text-base">${st.lastName} ${st.firstName} ${st.middleName}</h3><p class="text-xs text-slate-600">${st.faculty} - ${st.course} կուրս</p>`;
            renderStudentTopics(st);
            document.getElementById('studentDetailModal').classList.remove('hidden');
        }

        function closeStudentDetailModal() {
            document.getElementById('studentDetailModal').classList.add('hidden');
            currentSelectedStudentId = null;
        }

        function handleSaveTopic(e) {
            e.preventDefault();
            if (!currentSelectedStudentId) return;
            const st = appData.students.find(s => s.id === currentSelectedStudentId);
            if (!st) return;
            st.topics.push({
                id: 'top_' + Date.now(),
                subject: document.getElementById('topicSubject').value.trim(),
                title: document.getElementById('topicTitle').value.trim(),
                status: 'active'
            });
            saveToLocalStorage();
            renderStudentTopics(st);
            e.target.reset();
        }

        function renderStudentTopics(st) {
            const list = document.getElementById('studentTopicsList');
            list.innerHTML = '';
            const active = st.topics.filter(t => t.status === 'active');
            if (active.length === 0) {
                list.innerHTML = '<p class="text-xs text-slate-400">Թեմաներ չկան</p>';
                return;
            }
            active.forEach(t => {
                const item = document.createElement('div');
                item.className = 'bg-white border p-3 rounded-xl flex justify-between items-center text-xs';
                item.innerHTML = `<span><strong>${t.subject}:</strong> ${t.title}</span>`;
                list.appendChild(item);
            });
        }

        function populateStudentSelects() {
            const sel = document.getElementById('gradebookStudentSelect');
            sel.innerHTML = '';
            appData.students.forEach(st => {
                const opt = document.createElement('option');
                opt.value = st.id;
                opt.textContent = `${st.lastName} ${st.firstName}`;
                sel.appendChild(opt);
            });
        }

        function loadStudentGradebook(id) {
            const container = document.getElementById('gradebookContainer');
            container.innerHTML = `<div class="bg-white p-4 rounded-2xl border">Օրագիրը ակտիվ է</div>`;
        }

        function renderArchive() {}
        function renderHistory() {}
        function updateGlobalStats() {
            document.getElementById('statTotalStudents').textContent = appData.students.length;
        }
        function handleSearch(q) {
            const query = q.toLowerCase().trim();
            if (!query) { renderStudents(); return; }
            const filtered = appData.students.filter(s => s.firstName.toLowerCase().includes(query) || s.lastName.toLowerCase().includes(query));
            renderStudents(filtered);
        }
        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData));
            const dl = document.createElement('a');
            dl.setAttribute("href", dataStr);
            dl.setAttribute("download", "Usanog_Backup.json");
            dl.click();
        }
        function importData(e) {
            const reader = new FileReader();
            if (e.target.files[0]) {
                reader.onload = function(evt) {
                    try {
                        appData = JSON.parse(evt.target.result);
                        saveToLocalStorage();
                        renderStudents();
                        updateGlobalStats();
                        alert('Բեռնվեց հաջողությամբ!');
                    } catch(err) { alert('Սխալ ֆայլ'); }
                };
                reader.readAsText(e.target.files[0]);
            }
        }
    </script>
</body>
</html>
